<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise KB Assistant Chat</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #ffffff; }

    #layout { display: flex; height: 100vh; }

    /* 左侧侧边栏 */
    .sidebar {
      width: 320px;
      background: #ffffff;
      border-right: 1px solid #d0d7de;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar h2 { margin: 0 0 15px; font-size: 18px; color: #333; }
    .nav-btn {
      padding: 12px;
      width: 100%;
      border: none;
      background: #f0f4ff;
      color: #0052cc;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      font-weight: bold;
      transition: 0.2s ease;
    }
    .red-btn { background: #ff4d4f; color: #fff; }
    .red-btn:hover { background: #ff7875; }
    .nav-btn:hover { background: #d7e4ff; }
    .upload {
      padding: 12px;
      margin-top: 10px;
      background: #e9f7ef;
      color: #2e7d32;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      border: none;
      transition: 0.2s ease;
    }
    .upload:hover { background: #c8e6c9; }
    .history { margin-top: 20px; flex: 1; overflow-y: auto; border-top: 1px solid #eee; padding-top: 10px; }
    .history-item {
      padding: 8px 10px;
      border-radius: 6px;
      background: #f9f9f9;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid #e2e2e2;
      transition: 0.15s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-item:hover { background: #ececec; }

    /* 右侧聊天区域 */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: auto;
      background: #ffffff;
      border-left: 1px solid #ddd;
      border-right: 1px solid #ddd;
      padding: 0 20px;
      box-sizing: border-box;
      height: 100vh;
    }

    /* 聊天消息区域 */
    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-box { display: flex; gap: 10px; align-items: flex-start; }
    .msg {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .user-box { justify-content: flex-end; }
    .user { background: #0084ff; color: white; border-bottom-left-radius: 2px; }
    .user-avatar { background-image: url('https://cdn-icons-png.flaticon.com/512/747/747376.png'); }

    .bot-box { justify-content: flex-start; }
    .bot { background: #f2f4f7; border: 1px solid #ddd; border-bottom-right-radius: 2px; }
    .bot-avatar { background-image: url('https://cdn-icons-png.flaticon.com/512/4712/4712100.png'); }

    /* 输入框固定在底部 */
    .input-box {
      display: flex;
      padding: 16px 0;
      background: #ffffff;
      border-top: 1px solid #ddd;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 14px;
    }
    button.send {
      margin-left: 10px;
      padding: 12px 20px;
      border: none;
      background: #0084ff;
      color: #fff;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .sidebar { display: none; }
      .chat-container { max-width: 100%; margin: 0; border: none; }
    }
  </style>
</head>
<body>
  <div id="layout">
    <div class="sidebar">
      <h2>功能面板</h2>
      <button class="nav-btn" onclick="newChat()">＋ 新建会话</button>
      <button class="nav-btn" onclick="showPayload()">📦 查看请求参数</button>
      <h2 style="margin-top:25px;">历史记录</h2>
      <div class="history" id="history"></div>
      <button class="nav-btn red-btn" onclick="clearHistory()">🗑 清除历史记录</button>
      <h2 style="margin-top:25px;">系统设置</h2>
      <button class="nav-btn red-btn" onclick="window.location.href='reindex.html'">⟳ 重建索引</button>
      <button class="upload" onclick="uploadKB()">↑ 上传知识库</button>
    </div>

    <div class="chat-container">
      <div class="chat-window" id="chatWindow" aria-live="polite"></div>
      <div class="input-box">
        <input id="input" type="text" placeholder="请输入内容并按回车..." autocomplete="off" />
        <button class="send" id="sendBtn">发送</button>
      </div>
    </div>
  </div>

<script>
  const API_URL = "http://127.0.0.1:8002/chat";

  function initSession() {
    localStorage.removeItem("session_id");
    const sessionId = Math.random().toString(36).slice(2);
    localStorage.setItem("session_id", sessionId);
    return sessionId;
  }

  let sessionId = initSession();
  const historyContainer = document.getElementById("history");
  const chatWindow = document.getElementById("chatWindow");
  const inputEl = document.getElementById("input");

  let historyData = JSON.parse(localStorage.getItem("chat_history") || "[]");

  function newChat() {
    sessionId = initSession();
    chatWindow.innerHTML = "";
  }

  function renderHistory() {
  historyContainer.innerHTML = "";
  // 倒序遍历历史数据
  for (let i = historyData.length - 1; i >= 0; i--) {
    const item = historyData[i];
    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent = item.text;
    div.title = item.text;

    div.onclick = () => { inputEl.value = item.text; inputEl.focus(); };

    div.oncontextmenu = (e) => {
      e.preventDefault();
      if (confirm("删除这条记录？")) {
        historyData.splice(i, 1);
        localStorage.setItem("chat_history", JSON.stringify(historyData));
        renderHistory();
      }
    };

    historyContainer.appendChild(div);
  }
}


  function clearHistory() {
    if (!confirm("确定要清除所有历史记录吗？")) return;
    historyData = [];
    localStorage.setItem("chat_history", "[]");
    renderHistory();
    chatWindow.innerHTML = "";
  }

  function appendMsg(role, text) {
    const box = document.createElement("div");
    box.className = `msg-box ${role}-box`;
    const avatar = document.createElement("div");
    avatar.className = `avatar ${role}-avatar`;
    const msg = document.createElement("div");
    msg.className = `msg ${role}`;
    msg.textContent = text;

    if (role === "user") { box.appendChild(msg); box.appendChild(avatar); }
    else { box.appendChild(avatar); box.appendChild(msg); }

    chatWindow.appendChild(box);
    chatWindow.scrollTop = chatWindow.scrollHeight; // 自动滚动到底部
    return msg;
  }

  async function sendMsg() {
    const text = inputEl.value.trim();
    if (!text) return;
    appendMsg("user", text);

    historyData.push({ text });
    localStorage.setItem("chat_history", JSON.stringify(historyData));
    renderHistory();

    inputEl.value = "";
    const loading = appendMsg("bot", "系统正在回复…");

    const payload = { text, session_id: sessionId, user_role: "public", requester: "cao" };

    try {
      const resp = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      loading.textContent = data.answer || data.text || "（无返回）";
      chatWindow.scrollTop = chatWindow.scrollHeight; // 回复后滚动到底部
    } catch (err) {
      loading.textContent = "请求失败：" + err;
    }
  }

  document.getElementById("sendBtn").onclick = sendMsg;
  inputEl.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); sendMsg(); } };

  renderHistory();

  function showPayload() {
    const text = inputEl.value.trim();
    const payload = { text, session_id: sessionId, user_role: "public", requester: "cao" };
    alert("当前请求参数字段：\n\n" + JSON.stringify(payload, null, 2));
  }

function uploadKB() {
    const fileInput = document.createElement("input");
    fileInput.type = "file";

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;

      const visibility = prompt("请输入可见性（public / internal）", "public");
      if (!visibility) return;

      const docId = prompt("请输入文档 ID（可留空）", "");

      const formData = new FormData();
      formData.append("file", file);
      formData.append("visibility", visibility);
      if (docId) formData.append("doc_id", docId);

      try {
        const resp = await fetch(INGEST_URL, {
          method: "POST",
          body: formData
        });

        const data = await resp.json();
        if (!resp.ok) {
          alert("上传失败：" + (data.detail || "未知错误"));
          return;
        }

        alert(
          "上传成功！\n\n" +
          "文件路径：" + data.saved_as + "\n" +
          "可见性：" + data.visibility + "\n" +
          "切块数量：" + data.chunks
        );
      } catch (err) {
        alert("上传请求失败：" + err);
      }
    };

    fileInput.click();
  }

</script>
</body>
</html>
